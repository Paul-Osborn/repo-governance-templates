name: Governance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  invariants:
    name: Governance / invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate governance structure
        run: sh scripts/ci/validate-governance.sh
      - name: Reject oversized files added by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/hooks/check-large-files.sh --range "$BASE_SHA" "$HEAD_SHA"

  secrets:
    name: Governance / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "/tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
      - name: Scan repository history for secrets
        run: /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

  actions-security:
    name: Governance / actions-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  project:
    name: Project / checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned acceptance CLIs
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          LEFTHOOK_VERSION: 2.1.14
          LEFTHOOK_SHA256: 2be3187101b3a2edd5edf8b546aa2e3820531c517b4cd0216601a9c06f07c42d
        run: |
          set -eu
          tool_dir=/tmp/governance-tools
          mkdir -p "$tool_dir"

          gitleaks_archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gitleaks_archive}" \
            --output "/tmp/${gitleaks_archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "/tmp/${gitleaks_archive}" | sha256sum --check
          tar -xzf "/tmp/${gitleaks_archive}" -C "$tool_dir" gitleaks

          lefthook_archive="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${lefthook_archive}" \
            --output "/tmp/${lefthook_archive}"
          printf '%s  %s\n' "$LEFTHOOK_SHA256" "/tmp/${lefthook_archive}" | sha256sum --check
          gzip -dc "/tmp/${lefthook_archive}" > "$tool_dir/lefthook"
          chmod +x "$tool_dir/lefthook"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Run project lint, test, and build checks
        run: |
          command -v pwsh >/dev/null 2>&1
          sh scripts/ci/project-checks.sh

  windows:
    name: Governance / windows-verification
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record host tool versions
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS  Image: $env:ImageOS"
          git --version
          $PSVersionTable.PSVersion
          & sh --version
      - name: Install checksum-pinned Gitleaks and Lefthook for Windows
        shell: pwsh
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
          LEFTHOOK_VERSION: 2.1.14
          LEFTHOOK_SHA256: ca196e8c76a28a2969b1be09b64b5dc538eeb6d367c5ad36a00db9b3acfd806e
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDir = Join-Path $env:RUNNER_TEMP 'governance-tools'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null

          $gitleaksZip = Join-Path $env:RUNNER_TEMP "gitleaks_$($env:GITLEAKS_VERSION)_windows_x64.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$($env:GITLEAKS_VERSION)/gitleaks_$($env:GITLEAKS_VERSION)_windows_x64.zip" -OutFile $gitleaksZip
          $gitleaksHash = (Get-FileHash -Path $gitleaksZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gitleaksHash -ne $env:GITLEAKS_SHA256) {
            throw "Gitleaks checksum mismatch: expected $($env:GITLEAKS_SHA256), got $gitleaksHash"
          }
          Expand-Archive -Path $gitleaksZip -DestinationPath $toolDir -Force

          $lefthookExe = Join-Path $toolDir 'lefthook.exe'
          Invoke-WebRequest -Uri "https://github.com/evilmartians/lefthook/releases/download/v$($env:LEFTHOOK_VERSION)/lefthook_$($env:LEFTHOOK_VERSION)_Windows_x86_64.exe" -OutFile $lefthookExe
          $lefthookHash = (Get-FileHash -Path $lefthookExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($lefthookHash -ne $env:LEFTHOOK_SHA256) {
            throw "Lefthook checksum mismatch: expected $($env:LEFTHOOK_SHA256), got $lefthookHash"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $toolDir
      - name: Run native Windows acceptance suite
        shell: pwsh
        run: .\tests\acceptance.ps1

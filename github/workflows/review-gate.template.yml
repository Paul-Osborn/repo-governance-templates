name: Review Gate

# This workflow is evaluated from the protected base branch. It never checks out or executes
# pull-request code. It writes one status to the exact PR head after a non-author approval.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] base workflow never checks out or executes PR code; write is one fixed commit status
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  exact-head-review:
    name: Review Gate / exact-head-review
    if: github.repository == github.event.pull_request.base.repo.full_name && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Verify review and publish exact-head status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          context='governance/exact-head-review'
          description='Independent review must approve this exact PR head'

          changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          substantive=$(printf '%s\n' "$changed" | awk '
            function trust(p) {
              return p ~ /^(AGENTS\.md|REPO_RULES\.md|\.governance-version|\.governance\/|governance-manifest\.json|governance-policy\.template\.json|new-governed-repo\.(sh|ps1)|update-(governance|global-rules)\.(sh|ps1)|github-governance\.(sh|ps1)|sync-remotes\.(sh|ps1)|github\/|lefthook\.yml|\.gitleaks\.toml|scripts\/(hooks|ci)\/|\.github\/(workflows\/|CODEOWNERS$|governance-profile\.json$)|CLAUDE\.md|GEMINI\.md|\.cursor\/|\.claude\/)/
            }
            trust($0) { print; next }
            $0 !~ /\.(md|markdown|txt|rst|adoc)$/ { print }
          ')

          state=failure
          if [[ -z "$substantive" ]]; then
            state=success
            description='Deterministically classified as prose-only'
          else
            reviewer=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq ".[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\" and .user.login != \"$PR_AUTHOR\") | .user.login" |
              head -n 1)
            if [[ -n "$reviewer" ]]; then
              state=success
              description="Exact HEAD approved by $reviewer"
            fi
          fi

          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context="$context" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$state" == success ]]

# Continuous checks — re-runs tests and the secret scan automatically.
# Copy to `.github/workflows/ci.yml`.
#
# Cost & runner notes:
#   - `push` fires only on `main`. Using ["**"] would double-bill every PR branch push.
#   - Keep jobs on Linux (ubuntu-latest) unless Windows/macOS is required for tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Replace the steps below with your project's test setup commands.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Example setup steps:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - run: npm ci
      # - run: npm test

  # Backstop behind the local lefthook gitleaks run.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # Size backstop behind the local large-file gate, for anything pushed from a machine
  # where lefthook wasn't installed.
  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject oversized files added by this PR
        env:
          MAX_KB: 2048
        run: |
          base=$(git merge-base origin/${{ github.base_ref || 'main' }} HEAD 2>/dev/null || git rev-parse HEAD~1)
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            size=$(git cat-file -s "HEAD:$f" 2>/dev/null) || continue
            if [ "$size" -gt $((MAX_KB * 1024)) ]; then
              echo "::error file=$f::$((size / 1024)) KB exceeds the ${MAX_KB} KB limit for a new file."
              rc=1
            fi
          done <<EOF
          $(git diff --name-only --diff-filter=A "$base" HEAD)
          EOF
          exit $rc

  # WORKLOG.md is the project's memory between sessions. An earlier version of this file
  # FAILED any PR that didn't touch it. That was a toll booth: every typo fix grew a line of
  # filler prose, which made the file that is supposed to be the signal into noise, and
  # taught everyone to write the entry for the robot rather than for the next session.
  #
  # Now it only looks at PRs that actually change code, and it WARNS rather than failing —
  # a reminder where a reminder helps, not a tax on trivial work.
  worklog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remind about WORKLOG on substantive PRs
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=50 --quiet || true
          changed=$(git diff --name-only "$(git merge-base $base HEAD)" HEAD)
          # Prose doesn't need a log entry about itself.
          substantive=$(echo "$changed" | grep -vE '(^docs/|\.md$|^WORKLOG$|^CHANGELOG$)' || true)
          if [ -z "$substantive" ]; then
            echo "Prose-only PR. No WORKLOG entry expected."
            exit 0
          fi
          if echo "$changed" | grep -qx 'WORKLOG.md'; then
            echo "WORKLOG.md updated."
          else
            echo "::warning::This PR changes code but doesn't touch WORKLOG.md. If it's a checkpoint the next session would need to know about, add a dated entry. If it's routine, ignore this."
          fi
